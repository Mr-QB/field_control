random_obstacles:
  ros__parameters:
    # Mỗi 3 số là [x, y, z] (m), trong frame base_link.
    # Placed around the UR3 workspace at the launch home pose.  They are
    # deliberately close enough to require a detour, without starting inside
    # the robot's base exclusion zone.
    fixed_positions: [0.24, -0.18, 0.34, 0.34, 0.12, 0.43, 0.18, 0.26, 0.56, -0.20, -0.20, 0.36, -0.26, 0.14, 0.52]
    # Bán kính tương ứng với từng vị trí ở trên, đơn vị m.
    fixed_radii: [0.07, 0.08, 0.06, 0.07, 0.06]
